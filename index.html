<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d14;font-family:'Zen Kaku Gothic New',sans-serif;color:#e8e8f0;}
select option{background:#1a1a2e;color:#e0e0f0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── レスポンシブ対応 ── */
/* スマホ用 */
@media (max-width: 600px) {
  .vm-logo { font-size: 28px !important; }
  .vm-tagline { font-size: 12px !important; }
  .vm-container { padding: 20px 12px 60px !important; }
  .vm-search-box { padding: 6px 6px 6px 12px !important; }
  .vm-search-input { font-size: 14px !important; }
  .vm-search-btn { padding: 8px 14px !important; font-size: 13px !important; }
  .vm-base-title { font-size: 18px !important; }
  .vm-artwork { width: 60px !important; height: 60px !important; }
  .vm-artwork-small { width: 40px !important; height: 40px !important; }
  .vm-info-badge { font-size: 11px !important; padding: 3px 8px !important; }
  .vm-chip { font-size: 12px !important; padding: 7px 12px !important; min-height: 36px; }
  .vm-result-card { padding: 12px !important; gap: 8px !important; flex-wrap: wrap; }
  .vm-result-main { min-width: 0; width: 100%; }
  .vm-mini-bar-wrap { width: 100% !important; min-width: unset !important; }
  .vm-result-rank { min-width: 24px !important; font-size: 16px !important; }
  .vm-range-info { display: none !important; }
  .vm-select-row { flex-wrap: wrap; gap: 6px; }
  .vm-select-label { font-size: 12px !important; }
  .vm-sel { font-size: 12px !important; width: 100%; }
  .vm-filter-row { gap: 6px !important; }
  .vm-add-btn { font-size: 12px !important; padding: 7px 12px !important; }
  .vm-modal { padding: 20px 16px !important; }
  .vm-modal-title { font-size: 16px !important; }
  .vm-hint-chip { font-size: 12px !important; padding: 7px 12px !important; }
}

/* タブレット用 */
@media (min-width: 601px) and (max-width: 900px) {
  .vm-container { padding: 28px 20px 60px !important; }
  .vm-chip { font-size: 13px !important; padding: 7px 14px !important; }
}

/* タッチデバイス用: タップしやすくする */
@media (hover: none) {
  .vm-chip, .vm-search-btn, .vm-add-btn, .vm-hint-chip, .vm-preview-btn {
    min-height: 40px;
  }
}
</style>
</head>

const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

// ── 表記ゆれ対応 ──────────────────────────────
// ひらがな→カタカナ変換
function toKatakana(str){
  return str.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}
// カタカナ→ひらがな変換
function toHiragana(str){
  return str.replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}
// 全角英数→半角変換
function toHalfWidth(str){
  return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
}
// 半角カタカナ→全角カタカナ
const HANKAKU_MAP={"ｦ":"ヲ","ｧ":"ァ","ｨ":"ィ","ｩ":"ゥ","ｪ":"ェ","ｫ":"ォ","ｬ":"ャ","ｭ":"ュ","ｮ":"ョ","ｯ":"ッ","ｰ":"ー","ｱ":"ア","ｲ":"イ","ｳ":"ウ","ｴ":"エ","ｵ":"オ","ｶ":"カ","ｷ":"キ","ｸ":"ク","ｹ":"ケ","ｺ":"コ","ｻ":"サ","ｼ":"シ","ｽ":"ス","ｾ":"セ","ｿ":"ソ","ﾀ":"タ","ﾁ":"チ","ﾂ":"ツ","ﾃ":"テ","ﾄ":"ト","ﾅ":"ナ","ﾆ":"ニ","ﾇ":"ヌ","ﾈ":"ネ","ﾉ":"ノ","ﾊ":"ハ","ﾋ":"ヒ","ﾌ":"フ","ﾍ":"ヘ","ﾎ":"ホ","ﾏ":"マ","ﾐ":"ミ","ﾑ":"ム","ﾒ":"メ","ﾓ":"モ","ﾔ":"ヤ","ﾕ":"ユ","ﾖ":"ヨ","ﾗ":"ラ","ﾘ":"リ","ﾙ":"ル","ﾚ":"レ","ﾛ":"ロ","ﾜ":"ワ","ﾝ":"ン","ﾞ":"゛","ﾟ":"゜"};
function toZenkakuKana(str){return str.replace(/[ｦ-ﾟ]/g,ch=>HANKAKU_MAP[ch]||ch);}

// 文字列を正規化（ひらがな・カタカナ・英数字の表記ゆれを吸収）
function normalize(str){
  if(!str)return "";
  let s=str.toLowerCase();
  s=toHalfWidth(s);
  s=toZenkakuKana(s);
  s=toHiragana(s);
  s=s.replace(/ /g,"").replace(/　/g,"");
  s=s.replace(/・/g,"").replace(/-/g,"").replace(/_/g,"");
  s=s.replace(/ー/g,"").replace(/〜/g,"");
  return s;
}

// 文字列が検索クエリにマッチするか（表記ゆれ対応＋よみがな対応）
function fuzzyMatch(target, query){
  if(!target||!query)return false;
  const t=normalize(target);
  const q=normalize(query);
  if(t.includes(q))return true;
  // よみがなでもマッチ
  const reading=ARTIST_READINGS[target];
  if(reading){
    const r=normalize(reading);
    if(r.includes(q))return true;
  }
  return false;
}
function midiToNote(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1);}
function tempoLabel(b){if(b<70)return{label:"スロー",color:"#60c0d0"};if(b<100)return{label:"ミドル",color:"#80d090"};if(b<140)return{label:"アップ",color:"#d0b040"};return{label:"ハイテンポ",color:"#e07060"};}

function diffColor(d){return["","#60c890","#90d860","#d0c040","#e08040","#e04040"][d];}
function diffLabel(d){return["","やさしい","初級","中級","上級","激ムズ"][d];}
function calcOverallDiff(s){return Math.round((s.rhythmDiff+s.leap+s.highNoteFreq)/3);}

function calcSimilarity(base,cand,filters){
  if(cand.id===base.id)return -1;
  const ol=Math.max(base.vocalRange.low,cand.vocalRange.low);
  const oh=Math.min(base.vocalRange.high,cand.vocalRange.high);
  const rangeScore=Math.max(0,oh-ol)/(base.vocalRange.high-base.vocalRange.low);
  const leapScore=1-Math.abs(base.leap-cand.leap)/4;
  const tempoScore=1-Math.min(Math.abs(base.tempo-cand.tempo)/100,1);
  let score=rangeScore*0.55+leapScore*0.25+tempoScore*0.2;
  if(filters.lowHighNote&&cand.highNoteFreq>2)score-=0.5;
  if(filters.genre!=="すべて"&&cand.genre!==filters.genre)score-=0.6;
  if(filters.leap!==null&&Math.abs(cand.leap-filters.leap)>1)score-=0.4;
  if(filters.rhythmDiffMax!==null&&cand.rhythmDiff>filters.rhythmDiffMax)score-=0.6;
  if(filters.tempoBand!=="すべて"&&tempoLabel(cand.tempo).label!==filters.tempoBand)score-=0.5;
  if(filters.rhythmType!=="すべて"&&cand.rhythmType!==filters.rhythmType)score-=0.5;
  return score;
}

  function computeResults(base,f,db){
    const d=db||songDB;
    return d.map(s=>({...s,score:calcSimilarity(base,s,f)})).filter(s=>s.score>0).sort((a,b)=>{const da=calcOverallDiff(a),db=calcOverallDiff(b);if(da!==db)return da-db;return b.score-a.score;});
  }

  // あいまい検索：アーティスト候補（表記ゆれ対応）
  function handleArtistSuggest(val){
    if(!val.trim()){setArtistCandidates([]);return;}
    const artists=[...new Set(songDB.map(s=>s.artist))];
    const matched=artists.filter(a=>fuzzyMatch(a,val)).slice(0,6);
    setArtistCandidates(matched);
  }

  // あいまい検索：曲名候補（表記ゆれ対応）
  function handleTitleSuggest(val){
    if(!val.trim()){setTitleCandidates([]);return;}
    // 曲名・アーティスト名どちらにもマッチ
    const matched=songDB.filter(s=>fuzzyMatch(s.title,val)||fuzzyMatch(s.artist,val)).slice(0,8);
    setTitleCandidates(matched);
  }

  // アーティスト選択 → そのアーティストの曲一覧表示
  function handleArtistSelect(artist){

    setTitleCandidates([]);

    setResults([]);

  }

  // 曲を直接選択
  async function handleSongSelect(song){
    setLoading(true);setSearched(true);setMatched(null);setResults([]);
    setMatchedItunes(null);setResultItunes({});setArtistSongs([]);
    setArtistCandidates([]);setTitleCandidates([]);setDisplayCount(20);
    setMatched(song);
    const itunesData=await fetchItunesInfo(song.title,song.artist);
    setMatchedItunes(itunesData);
    const scored=computeResults(song,filters);
    setResults(scored);
    const map={};
    await Promise.all(scored.map(async s=>{const d=await fetchItunesInfo(s.title,s.artist);if(d)map[s.id]=d;}));
    setResultItunes(map);
    setLoading(false);
  }

  async function handleSearch(){
    const aq=artistQuery.trim();
    const tq=titleQuery.trim();
    if(!aq&&!tq)return;
    setArtistCandidates([]);setTitleCandidates([]);

    // アーティスト名だけ入力された場合 → 曲一覧表示
    if(aq&&!tq){
      const songs=songDB.filter(s=>fuzzyMatch(s.artist,aq));
      if(songs.length>0){setArtistSongs(songs);setSearched(false);return;}
    }

    setLoading(true);setSearched(true);setMatched(null);setResults([]);
    setMatchedItunes(null);setResultItunes({});setArtistSongs([]);

    let found=null;
    if(aq&&tq){
      // アーティスト+曲名で絞り込み
      found=songDB.find(s=>fuzzyMatch(s.title,tq)&&fuzzyMatch(s.artist,aq));
      if(!found) found=songDB.find(s=>fuzzyMatch(s.title,tq));
    } else if(tq){
      found=songDB.find(s=>fuzzyMatch(s.title,tq)||fuzzyMatch(s.artist,tq));
    } else if(aq){
      found=songDB.find(s=>fuzzyMatch(s.artist,aq));
    }

    if(found){
      setMatched(found);
      const itunesData=await fetchItunesInfo(found.title,found.artist);
      setMatchedItunes(itunesData);
      const scored=computeResults(found,filters);
      setResults(scored);
      const map={};
      await Promise.all(scored.map(async s=>{const d=await fetchItunesInfo(s.title,s.artist);if(d)map[s.id]=d;}));
      setResultItunes(map);
    }
    setLoading(false);
  }

  function updateFilter(key,val){
    const nf={...filters,[key]:val};setFilters(nf);
    if(matched)setResults(computeResults(matched,nf));
  }

  function togglePreview(previewUrl,songId){

  }

  async function handleBulkAdd(){
    if(!bulkArtist.trim())return;
    setAddLoading(true);setAddError("");setBulkResults([]);
    try{
      const res=await fetch("/api/analyze",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({mode:"bulk",artist:bulkArtist.trim()})
      });
      if(!res.ok)throw new Error("API error");
      const data=await res.json();
      if(data.songs&&data.songs.length>0){
        setBulkResults(data.songs);
      } else {
        setAddError("曲が見つかりませんでした。アーティスト名を確認してください。");
      }
    }catch(e){
      setAddError("AIの取得に失敗しました。もう一度試してください。");
    }
    setAddLoading(false);
  }

  // 一括追加を確定
  async function confirmBulkAdd(){
    if(bulkResults.length===0)return;
    setAddLoading(true);
    let addedCount=0;
    const newDB=[...songDB];
    let nextId=Math.max(...songDB.map(s=>s.id))+1;
    for(const song of bulkResults){
      const already=songDB.some(s=>s.title===song.title&&s.artist===song.artist);
      if(!already){
        const saved=await saveSongToDB(song);
        if(saved){
          newDB.push({...song,id:nextId++});
          addedCount++;
        }
      }
    }
    setSongDB(newDB);
    saveSongDB(newDB);
    setExtraCount(prev=>prev+addedCount);
    setAddLoading(false);
  }

  async function handleAuth() {
    setAuthLoading(true);setAuthError("");setAuthSuccess("");
    if (authMode === "login") {
      const { error } = await signIn(authEmail, authPassword);
      if (error) setAuthError("メールアドレスまたはパスワードが間違っています");
      else { setShowAuth(false); setAuthEmail(""); setAuthPassword(""); }
    } else if (authMode === "signup") {
      if (authPassword !== authPassword2) {
        setAuthError("パスワードが一致しません");
        setAuthLoading(false);
        return;
      }
      if (authPassword.length < 6) {
        setAuthError("パスワードは6文字以上にしてください");
        setAuthLoading(false);
        return;
      }
      const { error } = await signUp(authEmail, authPassword);
      if (error) setAuthError("登録に失敗しました。メールアドレスを確認してください");
      else { setAuthSuccess("確認メールを送りました！メールのリンクをクリックしてからログインしてください。"); setAuthMode("login"); setAuthPassword(""); setAuthPassword2(""); }
    } else if (authMode === "reset") {
      const { error } = await supabase.auth.resetPasswordForEmail(authEmail, {
        redirectTo: window.location.origin,
      });

  }

        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({artist:bulkArtist.trim()})
      });
      if(!res.ok)throw new Error("API error");
      const data=await res.json();
      // すでにDBにある曲を除外
      const filtered=data.songs.filter(s=>
        !songDB.some(existing=>existing.title===s.title&&existing.artist===s.artist)
      );
      if(filtered.length===0){
        setAddError("すべての曲がすでにDBに存在します！");
      } else {
        setBulkResults(filtered);
      }
    }catch(e){
      setAddError("一括分析に失敗しました。もう一度試してください。");
    }
    setAddLoading(false);
  }

    let successCount=0;
    const newSongs=[];

      if(saved){

        newSongs.push({...song,id:newId});
        successCount++;
      }
    }
    if(newSongs.length>0){
      const newDB=[...songDB,...newSongs];
      setSongDB(newDB);
      saveSongDB(newDB);
      setExtraCount(prev=>prev+newSongs.length);
    }
    setShowAdd(false);

    modalBtnSecondary:{background:"rgba(255,255,255,0.08)",color:"#a0a0c0"},
    modalBtnConfirm:{background:"linear-gradient(135deg,#40c060,#30a050)",color:"#fff"},
    previewBox:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:14,marginTop:14},
    previewBoxTitle:{fontSize:13,color:"#9090b0",marginBottom:8},
    modalTabBtn:{flex:1,padding:"8px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"#9090b0",fontSize:13,cursor:"pointer"},
    modalTabBtnActive:{background:"rgba(136,96,224,0.3)",border:"1px solid rgba(160,120,255,0.5)",color:"#d0b0ff",fontWeight:700},
  };

  return (
    <div style={S.root}>
      <div style={{position:"fixed",top:"-20%",right:"-10%",width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle,rgba(120,80,220,0.15) 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={{position:"fixed",bottom:"-15%",left:"-10%",width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(60,180,220,0.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={S.container} className="vm-container">
        <header style={S.header}>
          <div style={S.logoRow}><span style={S.logoIcon}>♪</span><h1 style={S.logo} className="vm-logo">VoiceMatch</h1></div>
          <p style={S.tagline} className="vm-tagline">あなたの声域・リズム感に合う曲を見つけよう</p>
          {/* ユーザーメニュー */}
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:12}}>
            {currentUser ? (<>
              <button onClick={()=>setShowFavorites(!showFavorites)}
                style={{background:"rgba(255,180,50,0.15)",border:"1px solid rgba(255,180,50,0.3)",borderRadius:20,color:"#ffd060",padding:"6px 16px",fontSize:13,cursor:"pointer"}}>
                ⭐ お気に入り ({favorites.length})
              </button>
              <button onClick={async()=>{await signOut();}}
                style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:20,color:"#9090b0",padding:"6px 16px",fontSize:13,cursor:"pointer"}}>
                ログアウト
              </button>
            </>) : (
              <button onClick={()=>setShowAuth(true)}
                style={{background:"linear-gradient(135deg,#8860e0,#5090d8)",border:"none",borderRadius:20,color:"#fff",padding:"6px 20px",fontSize:13,cursor:"pointer",fontWeight:700}}>
                ログイン / 新規登録
              </button>
            )}
          </div>
        </header>

        {/* お気に入り一覧 */}
        {showFavorites&&currentUser&&(
          <div style={{background:"rgba(255,180,50,0.08)",border:"1px solid rgba(255,180,50,0.2)",borderRadius:14,padding:16,marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:"#ffd060",marginBottom:12}}>⭐ お気に入り一覧</div>
            {favorites.length===0?(
              <p style={{color:"#9090b0",fontSize:13}}>まだお気に入りがありません。曲の♡ボタンで追加できます！</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {favorites.map(key=>{
                  const [title,artist]=key.split("___");
                  const song=songDB.find(s=>s.title===title&&s.artist===artist);
                  return(
                    <div key={key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"rgba(255,255,255,0.04)",borderRadius:8}}>
                      <div>
                        <span style={{fontSize:13,color:"#e0e0f0",fontWeight:600}}>{title}</span>
                        <span style={{fontSize:11,color:"#7070a0",marginLeft:8}}>{artist}</span>
                      </div>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        {song&&<span style={{fontSize:11,color:"#8888a8"}}>{song.tempo}BPM</span>}
                        <button onClick={()=>toggleFavorite({title,artist})}
                          style={{background:"none",border:"none",color:"#ffd060",fontSize:16,cursor:"pointer"}}>⭐</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* アーティスト名検索 */}
        <div style={{marginBottom:8,position:"relative"}}>
          <div style={S.searchBox} className="vm-search-box">
            <span style={{fontSize:15,marginRight:8,opacity:0.6}}>🎤</span>
            <input style={S.input} className="vm-search-input"
              placeholder="アーティスト名（例：back number、YOASOBI）"
              value={artistQuery}
              onChange={e=>{setArtistQuery(e.target.value);handleArtistSuggest(e.target.value);}}
              onKeyDown={e=>e.key==="Enter"&&handleSearch()}/>
            {artistQuery&&<button style={S.clearBtn} onClick={()=>{setArtistQuery("");setArtistCandidates([]);}}>×</button>}
          </div>
          {artistCandidates.length>0&&(
            <div style={S.candidateBox}>
              {artistCandidates.map(a=>(
                <button key={a} style={S.candidateItem}
                  onClick={()=>{setArtistQuery(a);setArtistCandidates([]);handleArtistSelect(a);}}>
                  🎤 {a}
                </button>
              ))}
            </div>
          )}
          {/* もっと見るボタン */}
          {results.length > displayCount && (
            <div style={{textAlign:"center",marginTop:16}}>
              <button onClick={()=>setDisplayCount(prev=>prev+20)}
                style={{background:"rgba(136,96,224,0.2)",border:"1px solid rgba(136,96,224,0.4)",borderRadius:20,color:"#c0a0ff",padding:"10px 32px",fontSize:14,cursor:"pointer",fontWeight:700}}>
                もっと見る（残り{results.length - displayCount}曲）
              </button>
            </div>
          )}
        </div>

        {/* 曲名検索 */}
        <div style={{marginBottom:12,position:"relative"}}>
          <div style={S.searchBox} className="vm-search-box">
            <span style={{fontSize:15,marginRight:8,opacity:0.6}}>🎵</span>
            <input style={S.input} className="vm-search-input"
              placeholder="曲名（例：夜、ドライフラワー）"
              value={titleQuery}
              onChange={e=>{setTitleQuery(e.target.value);handleTitleSuggest(e.target.value);}}
              onKeyDown={e=>e.key==="Enter"&&handleSearch()}/>
            {titleQuery&&<button style={S.clearBtn} onClick={()=>{setTitleQuery("");setTitleCandidates([]);}}>×</button>}
          </div>
          {titleCandidates.length>0&&(
            <div style={S.candidateBox}>
              {titleCandidates.map(s=>(
                <button key={s.id} style={S.candidateItem}
                  onClick={()=>{setTitleQuery(s.title);setArtistQuery(s.artist);setTitleCandidates([]);handleSongSelect(s);}}>
                  🎵 {s.title} <span style={{color:"#7070a0",fontSize:11}}>/ {s.artist}</span>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* アーティストの曲一覧 */}
        {artistSongs.length>0&&!matched&&(
          <div style={S.artistSongBox}>
            <div style={S.artistSongTitle}>🎤 {artistQuery} の曲一覧（{artistSongs.length}曲）</div>
            <div style={S.artistSongGrid}>
              {artistSongs.map(s=>(
                <button key={s.id} style={S.artistSongItem} onClick={()=>handleSongSelect(s)}>
                  <div style={{fontWeight:700,fontSize:13,color:"#e0e0f0"}}>{s.title}</div>
                  <div style={{fontSize:11,color:"#7070a0",marginTop:2}}>{diffLabel(calcOverallDiff(s))} · {s.tempo}BPM · {tempoLabel(s.tempo).label}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* 検索ボタン＆追加ボタン */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <button style={S.searchBtn} className="vm-search-btn" onClick={handleSearch}>🔍 検索</button>
          <button style={{...S.addBtn,marginBottom:0}} className="vm-add-btn" onClick={()=>setShowAdd(true)}>✨ AIで曲を追加</button>
          <span style={{fontSize:12,color:"#606070"}}>
            {dbLoading?"読み込み中...":`DB: ${songDB.length}曲`}
          </span>
        </div>

        {loading&&<div style={S.loadingWrap}><div style={S.spinner}/><p style={{color:"#9090b0",fontSize:13,marginTop:12}}>曲情報を取得中...</p></div>}

        {!loading&&searched&&(
          <div>
            {!matched?(
              <div style={S.notFound}><span style={{fontSize:32}}>😅</span><p style={{marginTop:8,color:"#a0a0b0"}}>その曲はDBにありません。<br/>「✨ AIで曲を追加」で追加できます！</p></div>
            ):(<>
              <div style={S.baseCard}>
                <div style={S.baseCardInner}>
                  {matchedItunes?.artwork&&<img src={matchedItunes.artwork} alt="artwork" style={S.artwork} className="vm-artwork"/>}
                  <div style={{flex:1}}>
                    <div style={S.baseLabel}>入力した曲</div>
                    <div style={S.baseTitle} className="vm-base-title">{matched.title}</div>
                    <div style={S.baseArtist}>{matched.artist} · {matched.genre}</div>
                    <div style={{display:"flex",flexWrap:"wrap",marginTop:10}}>
                      <span style={S.infoBadge} className="vm-info-badge">🥁 {matched.tempo} BPM <span style={{color:tempoLabel(matched.tempo).color,fontWeight:700,marginLeft:4}}>{tempoLabel(matched.tempo).label}</span></span>
                      <span style={S.infoBadge} className="vm-info-badge">{RHYTHM_LABEL[matched.rhythmType].icon} {RHYTHM_LABEL[matched.rhythmType].label}</span>
                      <span style={{...S.infoBadge,color:diffColor(matched.rhythmDiff)}}>リズム難易度 {diffLabel(matched.rhythmDiff)}</span>
                      <span style={{...S.infoBadge,color:diffColor(calcOverallDiff(matched)),fontWeight:700}}>総合 {diffLabel(calcOverallDiff(matched))}</span>
                    </div>
                    {matchedItunes?.previewUrl&&<button style={{...S.previewBtn,...(playing?.songId==="base"?S.previewBtnActive:{})}} onClick={()=>togglePreview(matchedItunes.previewUrl,"base")}>{playing?.songId==="base"?"⏹ 停止":"▶ 試聴 (30秒)"}</button>}
                    <button onClick={()=>toggleFavorite(matched)}
                      style={{marginTop:8,background:favorites.includes(`${matched.title}___${matched.artist}`)?"rgba(255,200,0,0.2)":"rgba(255,255,255,0.06)",border:"1px solid rgba(255,200,0,0.3)",borderRadius:8,fontSize:12,cursor:"pointer",padding:"6px 14px",color:favorites.includes(`${matched.title}___${matched.artist}`)?"#ffd060":"#9090b0"}}>
                      {favorites.includes(`${matched.title}___${matched.artist}`)?"★ お気に入り済み":"☆ お気に入りに追加"}
                    </button>
                  </div>
                  <div style={S.rangeInfo} className="vm-range-info">
                    <div style={S.rangeLabel}>音域</div>
                    <div style={S.rangeValues}>{midiToNote(matched.vocalRange.low)}<span style={{color:"#8888aa",margin:"0 4px"}}>〜</span>{midiToNote(matched.vocalRange.high)}</div>
                  </div>
                </div>
                <div style={S.rangeBar}><div style={{...S.rangeBarFill,left:rangePercent(matched.vocalRange.low)+"%",width:(rangePercent(matched.vocalRange.high)-rangePercent(matched.vocalRange.low))+"%"}}/></div>
                <div style={S.rangeTicks}>{["C2","C3","C4","C5","C6"].map((n,i)=><span key={n} style={{left:(i/4*100)+"%",position:"absolute",fontSize:10,color:"#606070",transform:"translateX(-50%)"}}>{n}</span>)}</div>
              </div>

              <div style={S.filterPanel}>
                <div style={S.filterTitle}>🎛️ 絞り込みフィルター</div>
                <div style={S.filterSectionLabel}>🎵 音域</div>
                <div style={S.filterRow} className="vm-filter-row">
                  <button style={{...S.chip,...(filters.lowHighNote?S.chipOn:{})}} onClick={()=>updateFilter("lowHighNote",!filters.lowHighNote)}>高音が少ない</button>
                  {genres.map(g=><button key={g} style={{...S.chip,...(filters.genre===g?S.chipOn:{})}} onClick={()=>updateFilter("genre",g)}>{g}</button>)}
                </div>
                <div style={S.selectRow} className="vm-select-row"><span style={S.selectLabel} className="vm-select-label">跳躍度</span><select style={S.sel} className="vm-sel" value={String(filters.leap)} onChange={e=>updateFilter("leap",e.target.value==="null"?null:Number(e.target.value))}>{leapLabels.map(l=><option key={String(l)} value={String(l)}>{leapText[l]}</option>)}</select></div>
                <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:14,marginTop:14}}>
                  <div style={S.filterSectionLabel}>🥁 リズム・テンポ</div>
                  <div style={{...S.filterRow,marginBottom:8}}>{tempoBands.map(tb=><button key={tb} style={{...S.chip,...(filters.tempoBand===tb?S.chipOnTempo:{})}} onClick={()=>updateFilter("tempoBand",tb)}>{tb}</button>)}</div>
                  <div style={{...S.filterRow,marginBottom:8}}>{rhythmTypes.map(rt=><button key={rt.key} style={{...S.chip,...(filters.rhythmType===rt.key?S.chipOnRhythm:{})}} onClick={()=>updateFilter("rhythmType",rt.key)}>{rt.label}</button>)}</div>
                  <div style={S.selectRow} className="vm-select-row"><span style={S.selectLabel} className="vm-select-label">リズム難易度（上限）</span><select style={S.sel} className="vm-sel" value={String(filters.rhythmDiffMax)} onChange={e=>updateFilter("rhythmDiffMax",e.target.value==="null"?null:Number(e.target.value))}>{rdLabels.map(l=><option key={String(l)} value={String(l)}>{rdText[l]}</option>)}</select></div>
                </div>
              </div>

              {/* ソートボタン */}
          {results.length>0&&(
            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              {[
                {key:"popular",label:"🔥 人気順"},
                {key:"easy",label:"🎵 歌いやすい順"},
                {key:"range",label:"🎤 音域近い順"},
                {key:"tempo",label:"⚡ テンポ順"},
              ].map(s=>(
                <button key={s.key} onClick={()=>{setSortMode(s.key);setDisplayCount(20);}}
                  style={{padding:"6px 12px",borderRadius:20,border:"1px solid rgba(255,255,255,0.15)",fontSize:12,cursor:"pointer",
                    background:sortMode===s.key?"rgba(136,96,224,0.3)":"rgba(255,255,255,0.05)",
                    color:sortMode===s.key?"#d0b0ff":"#9090b0",fontWeight:sortMode===s.key?700:400}}>
                  {s.label}
                </button>
              ))}
            </div>
          )}
          <div style={S.resultsHeader}><span style={S.resultsTitle}>🎤 歌いやすい順に表示</span><span style={S.resultCount}>{results.length}件</span></div>
              {results.length===0?<div style={S.notFound}><p style={{color:"#a0a0b0"}}>条件に合う曲が見つかりませんでした。</p></div>:(
                <div style={S.resultGrid}>
                  {[...results].sort((a,b)=>{
                    if(sortMode==="easy"){const da=calcOverallDiff(a),db=calcOverallDiff(b);return da!==db?da-db:b.score-a.score;}
                    if(sortMode==="popular"){return (b.popularity||0)-(a.popularity||0);}
                    if(sortMode==="range"){
                      const aD=Math.abs(a.vocalRange.low-(matched?.vocalRange?.low||55))+Math.abs(a.vocalRange.high-(matched?.vocalRange?.high||72));
                      const bD=Math.abs(b.vocalRange.low-(matched?.vocalRange?.low||55))+Math.abs(b.vocalRange.high-(matched?.vocalRange?.high||72));
                      return aD-bD;
                    }
                    if(sortMode==="tempo"){return Math.abs(a.tempo-(matched?.tempo||120))-Math.abs(b.tempo-(matched?.tempo||120));}
                    return 0;
                  }).slice(0,displayCount).map((song,i)=>{
                    const tl=tempoLabel(song.tempo),od=calcOverallDiff(song),itunes=resultItunes[song.id];
                    return(
                    <div key={song.id} style={{...S.resultCard,animationDelay:`${i*0.07}s`}} className="vm-result-card">
                      {itunes?.artwork&&<img src={itunes.artwork} alt="" style={S.artworkSmall} className="vm-artwork-small"/>}
                      <div style={S.resultRank} className="vm-result-rank">#{i+1}</div>
                      <div style={S.resultMain} className="vm-result-main">
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:4}}>
                          <div style={S.resultTitle}>{song.title}</div>
                          <button onClick={e=>{e.stopPropagation();toggleFavorite(song);}}
                            style={{background:favorites.includes(`${song.title}___${song.artist}`)?"rgba(255,200,0,0.2)":"rgba(255,255,255,0.06)",border:"1px solid rgba(255,200,0,0.3)",borderRadius:6,fontSize:12,cursor:"pointer",padding:"2px 8px",flexShrink:0,color:favorites.includes(`${song.title}___${song.artist}`)?"#ffd060":"#9090b0"}}>
                            {favorites.includes(`${song.title}___${song.artist}`)?"★お気に入り":"☆"}
                          </button>
                        </div>
                        <div style={S.resultArtist}>{song.artist}</div>
                        <div style={S.resultTags}><span style={S.tag}>{song.genre}</span><span style={S.tag}>跳躍 {"★".repeat(song.leap)}{"☆".repeat(5-song.leap)}</span><span style={S.tag}>高音 {"★".repeat(song.highNoteFreq)}{"☆".repeat(5-song.highNoteFreq)}</span></div>
                        <div style={{...S.resultTags,marginTop:4}}><span style={{...S.tag,color:tl.color}}>🥁 {song.tempo}BPM · {tl.label}</span><span style={S.tag}>{RHYTHM_LABEL[song.rhythmType].icon} {RHYTHM_LABEL[song.rhythmType].label}</span><span style={{...S.tag,color:diffColor(song.rhythmDiff)}}>リズム {diffLabel(song.rhythmDiff)}</span></div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}><span style={{fontSize:10,color:"#707080",whiteSpace:"nowrap"}}>総合難易度</span><div style={{flex:1,height:4,background:"rgba(255,255,255,0.06)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:(od/5*100)+"%",background:diffColor(od),borderRadius:2}}/></div><span style={{fontSize:10,color:diffColor(od),whiteSpace:"nowrap"}}>{diffLabel(od)}</span></div>
                        {itunes?.previewUrl&&<button style={{...S.previewBtn,...(playing?.songId===song.id?S.previewBtnActive:{})}} onClick={()=>togglePreview(itunes.previewUrl,song.id)}>{playing?.songId===song.id?"⏹ 停止":"▶ 試聴"}</button>}
                      </div>
                      <div style={S.miniBarWrap} className="vm-mini-bar-wrap">
                        <div style={S.miniBar}><div style={{...S.miniBarBase,left:rangePercent(matched.vocalRange.low)+"%",width:(rangePercent(matched.vocalRange.high)-rangePercent(matched.vocalRange.low))+"%"}}/><div style={{...S.miniBarFill,left:rangePercent(song.vocalRange.low)+"%",width:(rangePercent(song.vocalRange.high)-rangePercent(song.vocalRange.low))+"%"}}/></div>
                        <div style={S.miniBarLabel}>{midiToNote(song.vocalRange.low)}〜{midiToNote(song.vocalRange.high)}</div>
                        <div style={S.scoreBar}><div style={{...S.scoreBarFill,width:Math.round(song.score*100)+"%"}}/></div>
                        <div style={S.scoreLabel}>一致度 {Math.round(song.score*100)}%</div>
                      </div>
                    </div>
                  );})}
                </div>
              )}
            </>)}
          </div>
        )}

        {!searched&&(
          <div style={S.hint}>
            <p style={{color:"#606070",fontSize:13}}>💡 試してみよう</p>
            <div style={S.hintChips}>
              {["ドライフラワー","夜に駆ける","Lemon","Shape of You","糸","うっせぇわ"].map(t=>(
                <button key={t} style={S.hintChip} className="vm-hint-chip" onClick={()=>{setTitleQuery(t);setArtistQuery("");setTimeout(handleSearch,0);}}>{t}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* 認証モーダル */}
      {showAuth&&(
        <div style={S.modalOverlay} onClick={e=>e.target===e.currentTarget&&setShowAuth(false)}>
          <div style={S.modal} className="vm-modal">
            <div style={S.modalTitle} className="vm-modal-title">
              {authMode==="login"?"🔑 ログイン":authMode==="signup"?"📝 新規登録":"🔑 パスワードリセット"}
            </div>
            {/* タブ */}
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <button onClick={()=>{setAuthMode("login");setAuthError("");}}
                style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontSize:13,background:authMode==="login"?"rgba(136,96,224,0.3)":"rgba(255,255,255,0.05)",color:authMode==="login"?"#d0b0ff":"#9090b0",fontWeight:authMode==="login"?700:400}}>
                ログイン
              </button>
              <button onClick={()=>{setAuthMode("signup");setAuthError("");}}
                style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontSize:13,background:authMode==="signup"?"rgba(136,96,224,0.3)":"rgba(255,255,255,0.05)",color:authMode==="signup"?"#d0b0ff":"#9090b0",fontWeight:authMode==="signup"?700:400}}>
                新規登録
              </button>
            </div>
            <input style={S.modalInput} type="email" placeholder="メールアドレス" value={authEmail} onChange={e=>setAuthEmail(e.target.value)}/>
            {authMode!=="reset"&&(
              <input style={S.modalInput} type="password" placeholder="パスワード（6文字以上）" value={authPassword} onChange={e=>setAuthPassword(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleAuth()}/>
            )}
            {authMode==="signup"&&(
              <input style={S.modalInput} type="password" placeholder="パスワード（確認用）" value={authPassword2||""} onChange={e=>setAuthPassword2(e.target.value)}/>
            )}
            {authError&&<p style={{color:"#e06060",fontSize:13,marginBottom:8}}>{authError}</p>}
            {authSuccess&&<p style={{color:"#60d090",fontSize:13,marginBottom:8}}>{authSuccess}</p>}
            {authMode==="login"&&(
              <p style={{fontSize:12,color:"#7070a0",marginBottom:8,cursor:"pointer",textDecoration:"underline"}}
                onClick={()=>{setAuthMode("reset");setAuthError("");setAuthSuccess("");}}>
                パスワードを忘れた方はこちら
              </p>
            )}
            {/* ソーシャルログイン */}
            {authMode!=="reset"&&(
              <div style={{marginBottom:12}}>
                <div style={{textAlign:"center",color:"#7070a0",fontSize:12,marginBottom:8}}>または</div>
                <button onClick={signInWithGoogle}
                  style={{width:"100%",padding:"10px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.08)",color:"#e0e0f0",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <span style={{fontSize:18}}>G</span> Googleでログイン
                </button>
              </div>
            )}
            <div style={S.modalBtnRow}>
              <button style={{...S.modalBtn,...S.modalBtnSecondary}} onClick={()=>setShowAuth(false)}>キャンセル</button>
              <button style={{...S.modalBtn,...S.modalBtnPrimary,...(authLoading?{opacity:0.6}:{})}}
                onClick={handleAuth} disabled={authLoading}>
                {authLoading?"処理中...":(authMode==="login"?"ログイン":authMode==="signup"?"登録する":"リセットメールを送る")}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ✨ AIで曲を追加モーダル */}
      {showAdd&&(
        <div style={S.modalOverlay} onClick={e=>e.target===e.currentTarget&&setShowAdd(false)}>
          <div style={S.modal} className="vm-modal">
            <div style={S.modalTitle} className="vm-modal-title">✨ AIで曲を追加</div>

            {/* タブ */}
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <button onClick={()=>{setAddMode("single");setAddResult(null);setBulkResults([]);setAddError("");}}
                style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontSize:13,background:addMode==="single"?"rgba(136,96,224,0.3)":"rgba(255,255,255,0.05)",color:addMode==="single"?"#d0b0ff":"#9090b0",fontWeight:addMode==="single"?700:400}}>
                1曲ずつ追加
              </button>
              <button onClick={()=>{setAddMode("bulk");setAddResult(null);setBulkResults([]);setAddError("");}}
                style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontSize:13,background:addMode==="bulk"?"rgba(136,96,224,0.3)":"rgba(255,255,255,0.05)",color:addMode==="bulk"?"#d0b0ff":"#9090b0",fontWeight:addMode==="bulk"?700:400}}>
                🎤 アーティスト一括追加
              </button>
            </div>

            {/* 1曲ずつ */}
            {addMode==="single"&&(<>
              <div style={S.modalDesc}>曲名を入力するとAIが自動で音域・リズム・難易度を分析します！</div>
              <input style={S.modalInput} placeholder="曲名（例：夜明け前）" value={addTitle} onChange={e=>setAddTitle(e.target.value)}/>
              <input style={S.modalInput} placeholder="アーティスト名（任意）" value={addArtist} onChange={e=>setAddArtist(e.target.value)}/>
              {addError&&<p style={{color:"#e06060",fontSize:13,marginBottom:8}}>{addError}</p>}
              {addResult&&(
                <div style={S.previewBox}>
                  <div style={S.previewBoxTitle}>AIの分析結果 — 確認してください</div>
                  <div style={{fontSize:15,fontWeight:700,color:"#e0d0ff",marginBottom:4}}>{addResult.title} / {addResult.artist}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    <span style={{...S.tag,fontSize:12}}>{addResult.genre}</span>
                    <span style={{...S.tag,fontSize:12}}>🥁 {addResult.tempo}BPM</span>
                    <span style={{...S.tag,fontSize:12}}>{RHYTHM_LABEL[addResult.rhythmType]?.icon} {RHYTHM_LABEL[addResult.rhythmType]?.label}</span>
                    <span style={{...S.tag,fontSize:12,color:diffColor(addResult.rhythmDiff)}}>リズム {diffLabel(addResult.rhythmDiff)}</span>
                    <span style={{...S.tag,fontSize:12}}>音域 {midiToNote(addResult.vocalRange.low)}〜{midiToNote(addResult.vocalRange.high)}</span>
                    <span style={{...S.tag,fontSize:12,color:diffColor(calcOverallDiff(addResult))}}>総合 {diffLabel(calcOverallDiff(addResult))}</span>
                  </div>
                </div>
              )}
              <div style={S.modalBtnRow}>
                <button style={{...S.modalBtn,...S.modalBtnSecondary}} onClick={()=>setShowAdd(false)}>キャンセル</button>
                {!addResult?(
                  <button style={{...S.modalBtn,...S.modalBtnPrimary,...(addLoading?{opacity:0.6}:{})}} onClick={handleAddSong} disabled={addLoading}>
                    {addLoading?"分析中...":"🤖 AIで分析"}
                  </button>
                ):(
                  <button style={{...S.modalBtn,...S.modalBtnConfirm}} onClick={confirmAddSong}>
                    ✅ DBに追加する
                  </button>
                )}
              </div>
            </>)}

            {/* アーティスト一括追加 */}
            {addMode==="bulk"&&(<>
              <div style={S.modalDesc}>アーティスト名を入力するとAIが代表曲〜20曲を一括分析してDBに追加します！</div>
              <input style={S.modalInput} placeholder="アーティスト名（例：YOASOBI、back number）" value={bulkArtist} onChange={e=>setBulkArtist(e.target.value)}/>
              {addError&&<p style={{color:"#e06060",fontSize:13,marginBottom:8}}>{addError}</p>}
              {bulkResults.length>0&&(
                <div style={{...S.previewBox,maxHeight:240,overflowY:"auto"}}>
                  <div style={S.previewBoxTitle}>AIの分析結果 — {bulkResults.length}曲（✕で除外できます）</div>
                  {bulkResults.map((s,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                      <div style={{flex:1}}>
                        <span style={{fontSize:13,color:"#e0e0f0"}}>{s.title}</span>
                        <span style={{fontSize:11,color:"#7070a0",marginLeft:8}}>{s.tempo}BPM · {diffLabel(calcOverallDiff(s))}</span>
                      </div>
                      <button onClick={()=>setBulkResults(prev=>prev.filter((_,idx)=>idx!==i))}
                        style={{background:"rgba(224,96,96,0.2)",border:"1px solid rgba(224,96,96,0.4)",borderRadius:6,color:"#e06060",fontSize:13,cursor:"pointer",padding:"2px 8px",flexShrink:0}}>
                        除外
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <div style={S.modalBtnRow}>
                <button style={{...S.modalBtn,...S.modalBtnSecondary}} onClick={()=>setShowAdd(false)}>キャンセル</button>
                {bulkResults.length===0?(
                  <button style={{...S.modalBtn,...S.modalBtnPrimary,...(addLoading?{opacity:0.6}:{})}} onClick={handleBulkAnalyze} disabled={addLoading}>
                    {addLoading?"分析中...":"🤖 一括分析する"}
                  </button>
                ):(
                  <button style={{...S.modalBtn,...S.modalBtnConfirm}} onClick={confirmBulkAdd}>
                    ✅ {bulkResults.length}曲をDBに追加する
                  </button>
                )}
              </div>
            </>)}
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
